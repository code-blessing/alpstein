<div class="opus-magnum-routable-edit">
    @if (creating || selectedOpusMagnum) {
        <app-opus-magnum-form
                [silvaOptionum]="selectedOpusMagnum"
                [saving]="saving"
                (save)="onSave($event)">
        </app-opus-magnum-form>
    } @else if (loading) {
        {{ 'text.loading' | transloco }}
    } @else {
        {{ 'text.itemNotFound' | transloco }}
    }
</div>
