<div class="edit-form-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ (silvaOptionum ? 'opusMagnum.edit.title' : 'opusMagnum.create.title') | transloco }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="silvaOptionumForm" (ngSubmit)="onSubmit()">
                <app-opus-magnum-silva-optionum-form-part [silvaOptionumForm]="silvaOptionumForm" />

                <app-form-validation-summary [form]="silvaOptionumForm" />

                <div class="form-actions">
                    @if (cancellable) {
                        <button mat-button type="button" (click)="onCancel()">
                            {{ 'action.cancel' | transloco }}
                        </button>
                    }
                    <button mat-raised-button color="primary" type="submit" [disabled]="!silvaOptionumForm.valid || saving">
                        @if (saving) {
                            <mat-progress-spinner class="save-button-spinner" value="75" diameter="18" aria-hidden="true" />
                        }
                        {{ 'action.save' | transloco }}
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
