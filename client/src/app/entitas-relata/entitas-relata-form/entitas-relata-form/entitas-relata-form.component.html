<div class="edit-form-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ (membrumRelatum ? 'entitasRelata.edit.title' : 'entitasRelata.create.title') | transloco }}</mat-card-title>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="membrumRelatumForm" (ngSubmit)="onSubmit()">
                <app-entitas-relata-membrum-relatum-form-part [membrumRelatumForm]="membrumRelatumForm" />

                <app-form-validation-summary [form]="membrumRelatumForm" />

                <div class="form-actions">
                    @if (cancellable) {
                        <button mat-button type="button" (click)="onCancel()">
                            {{ 'action.cancel' | transloco }}
                        </button>
                    }
                    <button mat-raised-button color="primary" type="submit" [disabled]="!membrumRelatumForm.valid || saving">
                        @if (saving) {
                            <mat-progress-spinner class="save-button-spinner" value="75" diameter="18" aria-hidden="true" />
                        }
                        {{ 'action.save' | transloco }}
                    </button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
