# A line comment style: give it a unique id (here "mermaid") and its start delimiter.
# commentType is either LINE_COMMENT or BLOCK_COMMENT.
commentStyle.mermaid.startOfComment=%%
commentStyle.mermaid.commentType=LINE_COMMENT

# A block comment style additionally needs an end delimiter.
commentStyle.markdown.startOfComment=<!--
commentStyle.markdown.endOfComment=-->
commentStyle.markdown.commentType=BLOCK_COMMENT

# Map a file extension (without the leading dot) to one or more comment style ids (comma-separated).
extension.md=markdown,mermaid
