spring.application.name=server
server.port=8081

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

org.codeblessing.alpstein.exampledata.createRandomData=true
org.codeblessing.alpstein.exampledata.createRandomData.forGeneratedItems=true

org.codeblessing.alpstein.persistence.type=in-memory

# spring-boot-starter-jdbc is always on the classpath, so Spring Boot would build a DataSource in
# every mode and fail the startup when no spring.datasource.url is set. PostgresDataSourceConfiguration
# imports the auto configuration back in for org.codeblessing.alpstein.persistence.type=postgres.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

